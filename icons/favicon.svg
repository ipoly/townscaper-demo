<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Small-size icon: one house on stilts over the sea. main.js recolors sky, sea and window by time of day -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f5f6"/>
      <stop offset="1" stop-color="#bfe3ea"/>
    </linearGradient>
    <clipPath id="tile"><rect width="32" height="32" rx="7"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="32" height="32" fill="url(#sky)"/>
    <rect y="25" width="32" height="7" fill="#5aa6c4"/>
    <g fill="#8a6446"><rect x="8.5" y="22" width="2.2" height="4"/><rect x="14.9" y="22" width="2.2" height="4"/><rect x="21.3" y="22" width="2.2" height="4"/></g>
    <rect x="6" y="21" width="20" height="2.2" rx="1.1" fill="#c9a57a"/>
    <rect x="7.5" y="11.5" width="17" height="10" fill="#fcc28d"/>
    <rect x="20" y="3.5" width="3.2" height="5" fill="#e1a874"/>
    <path d="M16 2 L27 12.5 L5 12.5 Z" fill="#af3d36" stroke="#af3d36" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="12.5" y="14" width="7" height="5" rx="1.2" fill="#34424f"/>
  </g>
</svg>
